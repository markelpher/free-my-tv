# Public APKs use a generic config and the existing personal signing identity.
name: Release Android TV
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'markelpher/free-my-tv' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate version tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          version="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/AndroidManifest.xml)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Android SDK (34)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          cp -R "$ANDROID_HOME/licenses" "$RUNNER_TEMP/sdk/licenses"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Full CI before signing
        run: bash tools/check.sh all
      - name: Rebuild with the persistent signing key
        env:
          SIGNING_KEY: ${{ secrets.FREEMYTV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo 'Signing secret is missing.' >&2; exit 1; }
          rm -f config.properties freemytv.keystore FreeMyTV.apk
          printf '%s' "$SIGNING_KEY" | base64 --decode > freemytv.keystore
          bash build.sh
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify FreeMyTV.apk
          cp FreeMyTV.apk "FreeMyTV-${GITHUB_REF_NAME}.apk"
          sha256sum "FreeMyTV-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt
      - name: Publish release automatically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "FreeMyTV-${GITHUB_REF_NAME}.apk" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Android TV $GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Remove staged key and build config
        if: always()
        run: rm -f freemytv.keystore config.properties && rm -rf out
